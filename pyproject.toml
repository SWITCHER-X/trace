[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-metadata"
version = "0.1.0"
description = "Universal file metadata and privacy inspector"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "CHARLES", email = "charles@example.com"},
]
license = {file = "LICENSE"}
keywords = ["metadata", "privacy", "exif", "pdf", "office", "opsec", "cybersecurity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Office/Business",
]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8", "bandit", "safety"]
exif = ["piexif>=1.1.3"]
pdf = ["PyPDF2>=3.0.0"]
web = ["flask>=3.0.0"]
# Security dependencies (optional, for production)
security = [
    "flask-limiter>=3.5.0",
    "flask-talisman>=1.1.0",
    "flask-wtf>=1.1.0",
    "werkzeug>=3.0.0",
]

[project.scripts]
trace = "tracemeta.cli:main"
trace-web = "tracemeta.web:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tracemeta*"]

[tool.bandit]
exclude_dirs = ["tests", ".git", "__pycache__"]
skip = ["B101", "B601"]  # Skip assert and subprocess tests

[tool.safety]
ignore = []  # No known vulnerabilities to ignore
