name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-cov piexif PyPDF2

      - name: Run unit tests
        run: |
          python3 -m pytest tests/ -v --cov=trace

      - name: Lint Python files
        run: |
          python3 -m py_compile trace/*.py tests/*.py
